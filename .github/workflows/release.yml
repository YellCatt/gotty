name: "tagged-release"

on:
  push:
    tags:
      - "v*"

jobs:
  tagged-release:
    name: "Tagged Release"
    runs-on: "ubuntu-latest"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: "Build"
      run: "make tools release-artifacts"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: builds/pkg/*/gotty

    - name: Create release notes
      run: |
        echo "Release generated from commit ${{ github.sha }}" > RELEASE_NOTES.md
        cat >> RELEASE_NOTES.md <<'EOF'
        Platforms included:
        - Linux amd64
        - Linux arm64
        - Linux mipsle (极路由2 - CGO 已禁用，纯静态/softfloat 编译)
        - Windows amd64
        EOF

    - uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: false
        draft: true
        files: |
          LICENSE
          builds/dist/*
          RELEASE_NOTES.md